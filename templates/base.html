<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title or "Hack the Big Data" }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS (white theme) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #ffffff;
    }
    .global-chat-panel {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 320px;
      max-height: 80vh;
      z-index: 1500;
    }
    .global-chat-messages {
      max-height: 320px;
      overflow-y: auto;
      font-size: 0.85rem;
    }
    #toggle-visibility-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 2000;
    }
    .truncate-text {
      display: inline-block;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body class="bg-white">

<nav class="navbar navbar-light bg-white border-bottom mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('client_home') }}">
      Jupyter Notebook
    </a>
    <div class="d-flex">
      <a href="{{ url_for('admin_home') }}" class="btn btn-outline-secondary btn-sm me-2">
        Admin
      </a>
    </div>
  </div>
</nav>

<div class="container-fluid" id="main-content">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="container">
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<!-- Floating toggle button -->
<button id="toggle-visibility-btn" class="btn btn-dark rounded-circle">
  Hide
</button>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  (function () {
    const btn = document.getElementById("toggle-visibility-btn");
    const content = document.getElementById("main-content");
    let hidden = false;

    btn.addEventListener("click", function () {
      hidden = !hidden;
      if (hidden) {
        content.style.display = "none";
        btn.textContent = "Show";
      } else {
        content.style.display = "block";
        btn.textContent = "Hide";
      }
    });
  })();
</script>

</body>
</html>
