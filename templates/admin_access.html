{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 480px;">
  <h3 class="mb-3">Change Admin Access Code</h3>
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form method="post">
        <div class="mb-3">
          <label class="form-label">New 6-digit PIN</label>
          <input type="password" name="new_pin" maxlength="6" minlength="6"
                 pattern="\\d{6}" class="form-control" required>
          <div class="form-text">Only digits, exactly 6 characters.</div>
        </div>
        <div class="d-flex justify-content-between">
          <a href="{{ url_for('admin_home') }}" class="btn btn-outline-secondary">Back</a>
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
