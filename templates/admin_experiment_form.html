{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 600px;">
  <h3 class="mb-3">
    {% if mode == 'new' %}New Experiment{% else %}Edit Experiment{% endif %}
  </h3>
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Experiment Name</label>
          <input type="text" name="experiment_name" class="form-control"
                 value="{{ experiment.experiment_name if experiment else '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Experiment Link</label>
          <input type="url" name="link" class="form-control"
                 value="{{ experiment.link if experiment else '' }}" required>
        </div>
        <div class="d-flex justify-content-between">
          <a href="{{ url_for('admin_home') }}" class="btn btn-outline-secondary">Back</a>
          <button type="submit" class="btn btn-primary">
            {% if mode == 'new' %}Create{% else %}Save Changes{% endif %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
